<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visage Landmark Overlay Demo</title>
    <style>
        body { margin: 0; overflow: hidden; background: #222; color: white; width: 100vw; height: 100vh; font-family: sans-serif; }
        canvas { position: absolute; inset: 0; z-index: 1; width: 100%; height: 100%; display: block; pointer-events: none; }
        #info { position: absolute; z-index: 2; top: 10px; left: 10px; background: rgba(0,0,0,0.5); padding: 10px; pointer-events: none; }
        #lens-video { position: absolute; inset: 0; z-index: 0; width: 100%; height: 100%; object-fit: cover; pointer-events: none; }
    </style>
</head>
<body>
    <div id="info">
        Faces: <span id="face-count">0</span><br>
        Vertices: <span id="vertex-count">0</span>
    </div>
    <canvas id="gl-canvas"></canvas>
    <script type="module" src="./demo3d.js"></script>
</body>
</html>
